name: Deploy ATP One Staging
on:
  push:
    branches:
      - "develop"
  pull_request:
    branches:
      - "develop"
  workflow_dispatch:
    inputs:
      force-deploy:
        description: 'Force deploy'
        type: boolean
        default: false
jobs:
  build-and-push:
    name: Build maven, images & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [config-server, discovery, auth-server, api-gateway,system-setting-mgmt]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref:  ${{ github.head_ref || github.ref_name}}
      - name: Debug logs
        run: |
          echo "Current dir : "
          ls backend || echo 'no backend'
          echo 'Find pom.xml'
          find . -name "pom.xml"
          echo "github.ref = ${{ github.ref }}"
          echo "github.ref_name = ${{ github.ref_name }}"
      - name: Build maven to jar
        working-directory: ${{ secrets.BE_PATH }}
        run: |
          mvn -pl ${{ matrix.service }} -am clean package -DskipTests
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push images ${{ matrix.service }}
        run: |
          docker build -f ${{ secrets.BE_PATH }}/${{ matrix.service }}/Dockerfile --build-arg JAR_FILE=${{ secrets.BE_PATH }}/${{ matrix.service }}/target/*.jar -t ${{ secrets.DOCKER_USERNAME }}/atpone-${{ matrix.service }}:1.0 .
          docker push ${{ secrets.DOCKER_USERNAME }}/atpone-${{ matrix.service }}:1.0
  deploy:
    name: Deploy ATP One to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_SERVER_IP }}
          username: ${{ secrets.SSH_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.SERVER_PROJECT_PATH }} 

            if [ ! -d "atpone/.git" ]; then
              git clone -b develop https://github.com/IrisDuong/atpone.git
              cd atpone
            else
              cd atpone
              git fetch origin
              git checkout develop || git checkout -b develop origin/develop
              git pull origin develop
            fi
            docker compose pull
            docker compose --env-file ../.env up -d
            docker image prune -f
            echo "Deploy ATP One production successfully"
          
